properties:
  - name: name
    type: string
    required: false
    details: []
    description: the name of the owner
    example: John Doe
  - name: partner
    type: partner
    required: true
    details: []
    description: partner of the owner
  - name: children
    type: array[] of child
    required: false
    details: []
    description: children of the owner
    items:
      refs:
        - child
  - name: parents
    type: array[] of parent
    required: false
    details: []
    description: parents of the owner
    items:
      refs:
        - parent
relationShips:
  - from: owner
    to: partner
    description: partner
    type: use
  - from: owner
    to: child
    description: children
    type: aggregation
  - from: owner
    to: parent
    description: parents
    type: aggregation
referencedFiles:
  - child.yaml
  - parent.yaml
