name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm test

    # Version comes from the release tag; nothing is committed, tagged or pushed.
    - name: Set version from release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION="${TAG#v}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag '$TAG' is not a valid version (expected X.Y.Z or vX.Y.Z)"
          exit 1
        fi
        npm version "$VERSION" --no-git-tag-version --allow-same-version

    - run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
