name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing: the job proves its identity to npm, no token secret

jobs:
  publish:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x # staged publishing needs npm 11.15 or newer
        registry-url: 'https://registry.npmjs.org'
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: npm test

    # Version comes from the release tag; nothing is committed, tagged or pushed.
    - name: Set version from release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION="${TAG#v}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag '$TAG' is not a valid version (expected X.Y.Z or vX.Y.Z)"
          exit 1
        fi
        npm version "$VERSION" --no-git-tag-version --allow-same-version

    # Uploads to npm's stage queue; a maintainer approves it on npmjs.com (Staged Packages) before it is installable.
    - run: npm stage publish
