# Lints and tests on every supported Node LTS line.
# See the Node release schedule at https://nodejs.org/en/about/previous-releases

name: Node.js CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22.13 is the engines floor; 22.x, 24.x and 26.x are the supported LTS lines
        node-version: ['22.13', 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run lint
    - run: npm test
