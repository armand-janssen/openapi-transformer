# Lints and tests on every supported Node LTS line.
# See the Node release schedule at https://nodejs.org/en/about/previous-releases

name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        # 22.13 is the engines floor; 22.x, 24.x and 26.x are the supported LTS lines
        node-version: ['22.13', 22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Node ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: npm test
